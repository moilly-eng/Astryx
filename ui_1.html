<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Huna Orbit — Your Emotional Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --purple: #534AB7;
    --purple-light: #a09af0;
    --teal: #1D9E75;
    --pink: #D4537E;
    --bg: #050a14;
    --surface: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --text: rgba(255,255,255,0.85);
    --muted: rgba(255,255,255,0.35);
    --dim: rgba(255,255,255,0.18);
  }

  html {
    height: 100%;
    width: 100%;
    /* Let the page be taller than the screen so iOS can scroll it
       above the keyboard — this is the key to making the input visible */
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  body {
    min-height: 100%;
    width: 100%;
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* ── STARFIELD ── */
  #starfield {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s);
  }

  @keyframes twinkle {
    0%, 100% { opacity: var(--min-op, 0.15); transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
  }

  .nebula {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    z-index: 0;
  }

  .nb1 { width: 500px; height: 400px; background: rgba(83,74,183,0.13); top: -120px; right: -120px; animation: drift 14s ease-in-out infinite; }
  .nb2 { width: 420px; height: 320px; background: rgba(29,158,117,0.09); bottom: -80px; left: -100px; animation: drift 17s ease-in-out infinite reverse; }
  .nb3 { width: 280px; height: 280px; background: rgba(212,83,126,0.07); top: 40%; left: 35%; animation: drift 20s ease-in-out infinite 4s; }
  .nb4 { width: 200px; height: 200px; background: rgba(83,74,183,0.07); bottom: 20%; right: 10%; animation: drift 11s ease-in-out infinite 2s; }

  @keyframes drift {
    0%, 100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(25px,-20px) scale(1.06); }
    66% { transform: translate(-12px,14px) scale(0.96); }
  }

  /* ── LAYOUT ── */
  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    /* At least fill the screen; grows taller when keyboard pushes things up */
    min-height: 100dvh;
    width: 100%;
    max-width: 820px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .logo-group { display: flex; align-items: center; gap: 14px; }

  .logo-orb {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: conic-gradient(from 200deg, var(--purple), var(--teal), var(--pink), #7F77DD, var(--purple));
    position: relative;
    animation: spin 9s linear infinite;
    flex-shrink: 0;
  }

  .logo-orb::after {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: var(--bg);
  }

  .logo-orb::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: conic-gradient(from 200deg, var(--purple), var(--teal), var(--pink), var(--purple));
    filter: blur(8px);
    opacity: 0.45;
    z-index: -1;
    animation: spin 9s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .logo-name {
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #a09af0 0%, #5DCAA5 50%, #D4537E 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .logo-sub {
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 2px;
    margin-top: 2px;
  }

  .header-right { display: flex; align-items: center; gap: 14px; }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .dot-live {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--teal);
    animation: pulse-dot 2.2s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { box-shadow: 0 0 0 0 rgba(29,158,117,0.5); }
    50% { box-shadow: 0 0 0 5px rgba(29,158,117,0); }
  }

  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 17px;
  }

  .icon-btn:hover {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.7);
    border-color: rgba(255,255,255,0.16);
  }

  /* ── CHAT AREA ── */
  .chat {
    flex: 1;
    /* No overflow:auto here — we let the page itself scroll so iOS
       keyboard-scroll works naturally */
    padding: 28px 0 20px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.07) transparent;
    min-height: 50vh;
  }

  .chat::-webkit-scrollbar { width: 4px; }
  .chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 2px; }

  /* ── WELCOME ── */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 0 28px;
    animation: fadeUp 0.7s ease both;
  }

  .welcome-orb {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: conic-gradient(from 200deg, var(--purple), var(--teal), var(--pink), #7F77DD, var(--purple));
    position: relative;
    animation: spin 11s linear infinite;
    margin-bottom: 22px;
  }

  .welcome-orb::after {
    content: '';
    position: absolute;
    inset: 7px;
    border-radius: 50%;
    background: var(--bg);
  }

  .welcome-orb::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(from 200deg, var(--purple), var(--teal), var(--pink), var(--purple));
    filter: blur(14px);
    opacity: 0.35;
    z-index: -1;
    animation: spin 11s linear infinite;
  }

  .welcome h2 {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--dim);
    text-transform: uppercase;
    font-weight: 400;
    margin-bottom: 8px;
  }

  .welcome p {
    font-size: 13px;
    color: var(--muted);
    font-weight: 300;
    font-style: italic;
    letter-spacing: 0.3px;
  }

  .chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 22px;
    justify-content: center;
  }

  .chip {
    padding: 8px 16px;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03);
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    cursor: pointer;
    transition: all 0.22s;
    user-select: none;
  }

  .chip:hover {
    border-color: rgba(160,154,240,0.4);
    background: rgba(83,74,183,0.14);
    color: rgba(160,154,240,0.9);
    transform: translateY(-2px);
  }

  /* ── MESSAGES ── */
  .msg-row {
    display: flex;
    gap: 12px;
    animation: fadeUp 0.32s ease both;
  }

  .msg-row.user { flex-direction: row-reverse; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .av {
    width: 30px; height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 3px;
  }

  .av-ai {
    background: conic-gradient(from 200deg, var(--purple), var(--teal), var(--pink), var(--purple));
    position: relative;
    animation: spin 12s linear infinite;
  }

  .av-ai::after {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: var(--bg);
  }

  .av-user {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255,255,255,0.55);
  }

  .bubble-wrap { display: flex; flex-direction: column; }
  .msg-row.user .bubble-wrap { align-items: flex-end; }

  .bubble {
    max-width: 580px;
    padding: 13px 17px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-line;
    word-break: break-word;
  }

  .bubble.ai {
    background: rgba(255,255,255,0.045);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
    color: var(--text);
  }

  .bubble.user {
    background: rgba(83,74,183,0.22);
    border: 1px solid rgba(160,154,240,0.18);
    border-top-right-radius: 4px;
    color: rgba(255,255,255,0.92);
  }

  .bubble-time {
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.5px;
    margin-top: 5px;
    padding: 0 4px;
  }

  /* ── TYPING ── */
  .typing-row { display: flex; gap: 12px; animation: fadeUp 0.3s ease both; }

  .typing-bub {
    background: rgba(255,255,255,0.045);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
    padding: 15px 20px;
    border-radius: 18px;
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .td {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(160,154,240,0.55);
    animation: bounce 1.3s ease-in-out infinite;
  }
  .td:nth-child(2) { animation-delay: 0.2s; }
  .td:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  /* ── INPUT DOCK ── */
  .dock {
    /* sticky keeps the dock at the bottom of the visible viewport as the
       page scrolls. When the keyboard opens on iOS, the browser scrolls
       the page up — sticky bottom means the dock follows the visible bottom
       edge, so it's always just above the keyboard, never hidden behind it. */
    position: sticky;
    bottom: 0;
    /* Glass background so messages don't show through as dock scrolls */
    background: var(--bg);
    padding: 14px 0 0;
    padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    flex-shrink: 0;
    /* Subtle top fade to blend with chat content scrolling under it */
    box-shadow: 0 -24px 32px 8px var(--bg);
  }

  .input-bar {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 11px 11px 11px 18px;
    transition: border-color 0.2s;
  }

  .input-bar:focus-within {
    border-color: rgba(160,154,240,0.38);
    background: rgba(255,255,255,0.055);
  }

  textarea#inp {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'DM Sans', sans-serif;
    /* iOS Safari auto-zooms the page on focus if the input's font-size is
       under 16px. 14.5px was triggering that zoom, which made the layout
       jump on top of the keyboard-covers-input issue. */
    font-size: 16px;
    color: var(--text);
    resize: none;
    max-height: 130px;
    min-height: 24px;
    line-height: 1.6;
    caret-color: var(--purple-light);
  }

  textarea#inp::placeholder { color: rgba(255,255,255,0.2); }

  .dock-btns { display: flex; gap: 7px; align-items: center; }

  .attach-btn {
    width: 34px; height: 34px;
    border-radius: 9px;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.28);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 17px;
  }

  .attach-btn:hover { color: rgba(255,255,255,0.55); background: rgba(255,255,255,0.06); }

  .send-btn {
    width: 38px; height: 38px;
    border-radius: 11px;
    border: none;
    background: linear-gradient(135deg, #534AB7, #7F77DD);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.22s;
    font-size: 16px;
    flex-shrink: 0;
  }

  .send-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 0 20px rgba(83,74,183,0.5);
  }

  .send-btn:active { transform: scale(0.96); }

  .dock-foot {
    text-align: center;
    margin-top: 11px;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .model-tag {
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: rgba(160,154,240,0.38);
    border: 1px solid rgba(160,154,240,0.14);
    padding: 2px 9px;
    border-radius: 4px;
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 2px; }
</style>
</head>
<body>

<div id="starfield"></div>
<div class="nebula nb1"></div>
<div class="nebula nb2"></div>
<div class="nebula nb3"></div>
<div class="nebula nb4"></div>

<div class="app">

  <!-- HEADER -->
  <header>
    <div class="logo-group">
      <div class="logo-orb"></div>
      <div>
        <div class="logo-name">HUNA ORBIT</div>
        <div class="logo-sub">STELLAR INTELLIGENCE</div>
      </div>
    </div>
    <div class="header-right">
      <div class="status-pill">
        <div class="dot-live"></div>
        Online
      </div>
      <button class="icon-btn" title="History"><i class="ti ti-history"></i></button>
      <button class="icon-btn" title="Settings"><i class="ti ti-settings"></i></button>
    </div>
  </header>

  <!-- CHAT -->
  <div class="chat" id="chat">
    <div class="welcome" id="welcome">
      <div class="welcome-orb"></div>
      <h2>Huna Orbit</h2>
      <p>Your warm, emotionally intelligent companion</p>
      <div class="chips">
        <div class="chip" onclick="quickSend(this)">✦ Who are you?</div>
        <div class="chip" onclick="quickSend(this)">✦ Explain black holes</div>
        <div class="chip" onclick="quickSend(this)">✦ Write a space poem</div>
        <div class="chip" onclick="quickSend(this)">✦ What can you do?</div>
        <div class="chip" onclick="quickSend(this)">✦ Tell me something cosmic</div>
      </div>
    </div>
  </div>

  <!-- INPUT -->
  <div class="dock">
    <div class="input-bar">
      <textarea id="inp" placeholder="Message Huna Orbit…" rows="1"
        onkeydown="onKey(event)" oninput="resize(this)"></textarea>
      <div class="dock-btns">
        <button class="attach-btn" title="Attach file"><i class="ti ti-paperclip"></i></button>
        <button class="send-btn" onclick="send()" title="Send"><i class="ti ti-send"></i></button>
      </div>
    </div>
    <div class="dock-foot">
      Huna Orbit · messages are not stored
    </div>
  </div>

</div>

<script>
  // ── MOBILE KEYBOARD FIX ──
  // iOS Safari: keyboard opens and the browser scrolls the page up automatically.
  //   position:sticky on .dock keeps it above the keyboard. We just call
  //   scrollIntoView after the animation and iOS handles the rest.
  //
  // Android Chrome: keyboard opens and visualViewport.height shrinks, BUT the
  //   page does NOT scroll. So sticky:bottom stays glued to the layout-viewport
  //   bottom which is now BEHIND the keyboard. Fix: detect the keyboard height
  //   from visualViewport and switch the dock to position:fixed, pinning it
  //   just above the keyboard.

  const dock = document.querySelector('.dock');
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  function onViewportChange() {
    if (isIOS) return;
    const vv = window.visualViewport;
    if (!vv) return;

    const keyboardHeight = window.innerHeight - vv.height - vv.offsetTop;

    const chat = document.getElementById('chat');
    if (keyboardHeight > 50) {
      dock.style.position = 'fixed';
      dock.style.bottom = keyboardHeight + 'px';
      dock.style.left = '0';
      dock.style.right = '0';
      dock.style.width = '100%';
      dock.style.maxWidth = '820px';
      dock.style.margin = '0 auto';
      dock.style.padding = '14px 20px 14px';
      dock.style.zIndex = '100';
      // Push chat content up so it isn't hidden behind the fixed dock
      chat.style.paddingBottom = (dock.offsetHeight + 16) + 'px';
      setTimeout(scrollEnd, 80);
    } else {
      dock.style.cssText = '';
      chat.style.paddingBottom = '';
    }
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onViewportChange);
    window.visualViewport.addEventListener('scroll', onViewportChange);
  }

  function scrollInputIntoView() {
    const inp = document.getElementById('inp');
    if (inp) inp.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ── STARS ──
  const sf = document.getElementById('starfield');
  for (let i = 0; i < 150; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() < 0.12 ? 2.5 : Math.random() < 0.45 ? 1.5 : 1;
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2.5+Math.random()*5}s;--delay:-${Math.random()*7}s;--min-op:${0.08+Math.random()*0.25};`;
    sf.appendChild(s);
  }

  // ── RESPONSES ──
  function getReply(text) {
    return "I’m sorry, I couldn’t generate a reply right now. Please try again in a moment.";
  }

  function getTime() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function resize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 130) + 'px';
  }

  function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }

  function quickSend(el) {
    document.getElementById('inp').value = el.textContent.replace('✦ ', '').trim();
    send();
  }

  const chat = document.getElementById('chat');

  function scrollEnd() {
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  function addMsg(html, role) {
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    const row = document.createElement('div');
    row.className = 'msg-row ' + role;

    if (role === 'ai') {
      row.innerHTML = `
        <div class="av av-ai"></div>
        <div class="bubble-wrap">
          <div class="bubble ai">${html}</div>
          <div class="bubble-time">Huna Orbit · ${getTime()}</div>
        </div>`;
    } else {
      row.innerHTML = `
        <div class="bubble-wrap">
          <div class="bubble user">${html}</div>
          <div class="bubble-time">You · ${getTime()}</div>
        </div>
        <div class="av av-user">U</div>`;
    }

    chat.appendChild(row);
    scrollEnd();
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.id = 'typing';
    row.innerHTML = `
      <div class="av av-ai"></div>
      <div class="typing-bub">
        <div class="td"></div><div class="td"></div><div class="td"></div>
      </div>`;
    chat.appendChild(row);
    scrollEnd();
  }

  function hideTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // After the keyboard finishes animating (~350ms on iOS, ~300ms on Android),
  // scroll the input into view. Because the page can now scroll freely,
  // scrollIntoView actually works here — no fixed/overflow:hidden fighting it.
  document.getElementById('inp').addEventListener('focus', () => {
    setTimeout(scrollInputIntoView, 350);
  });

  async function send() {
    const inp = document.getElementById('inp');
    const raw = inp.value.trim();
    if (!raw) return;
    inp.value = '';
    inp.style.height = 'auto';

    addMsg(esc(raw), 'user');
    showTyping();

    try {
      const apiUrl = window.location.origin + '/api/chat';
      const res = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: raw })
      });
      const data = await res.json();
      hideTyping();
      if (data.reply) {
        addMsg(data.reply, 'ai');
      } else if (data.error) {
        addMsg(esc('Error: ' + data.error), 'ai');
      } else {
        addMsg(getReply(raw), 'ai');
      }
    } catch (err) {
      hideTyping();
      addMsg(esc('I couldn\'t reach the assistant service. Please try again.'), 'ai');
    }
  }
</script>
